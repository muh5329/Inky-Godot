<h1>INKWAVE · Original audio renderer</h1><button id="start">Render native audio assets</button><pre id="status">Ready. Output is saved only to this local Godot project.</pre>
<script type="module">
import * as A from '/source_reference/src/audio/audio.js';import * as M from '/source_reference/src/audio/music.js';import '/source_reference/src/game/kits/index.js';
const SR=32000;const log=s=>document.querySelector('#status').textContent+='\n'+s;
const save=async(name,data)=>{const r=await fetch('/save/'+name,{method:'POST',body:data});if(!r.ok)throw Error(await r.text());};
function wav(buf,trim){let n=buf.length;const cs=[buf.getChannelData(0),buf.getChannelData(1)];if(trim){while(n>SR*.08&&Math.max(Math.abs(cs[0][n-1]),Math.abs(cs[1][n-1]))<.0001)n--;n=Math.min(buf.length,n+800);}let peak=0;const b=new ArrayBuffer(44+n*4),v=new DataView(b);const str=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};str(0,'RIFF');v.setUint32(4,b.byteLength-8,true);str(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,2,true);v.setUint32(24,SR,true);v.setUint32(28,SR*4,true);v.setUint16(32,4,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,n*4,true);for(let i=0;i<n;i++)for(let c=0;c<2;c++){const x=cs[c][i];if(!Number.isFinite(x))throw Error('Invalid audio sample');peak=Math.max(peak,Math.abs(x));v.setInt16(44+(i*2+c)*2,Math.round(Math.max(-1,Math.min(1,x))*32767),true);}return {bytes:b,seconds:n/SR,peak};}
function engine(seconds){const ctx=new OfflineAudioContext(2,Math.ceil(seconds*SR),SR),eng=new A.AudioEngine({context:ctx,seed:1234,music:false});eng.init();eng.setVolumes({master:1,music:1,sfx:1});eng.master.gain.value=eng.sfxBus.gain.value=eng.musicBus.gain.value=1;return {ctx,eng};}
document.querySelector('#start').onclick=async()=>{document.querySelector('#start').disabled=true;try{const manifest={source:'98ea29694ab3eebaaeaa995c2b525ac883a48de5',sampleRate:SR,sfx:{},music:{}};
for(const [name,d] of Object.entries(A.SFX)){const {ctx,eng}=engine(d.loop?5:7);eng.play(name,{at:.01});const w=wav(await ctx.startRendering(),true);await save('sfx_'+name+'.wav',w.bytes);manifest.sfx[name]={seconds:w.seconds,peak:w.peak,loop:!!d.loop};log('SFX '+name);}
for(const [id,song] of Object.entries(M.SONGS)){const s=M.getSong(id),bar=240/s.bpm,seconds=s.bars.length*bar;const {ctx,eng}=engine(seconds+2);const m=new M.MusicEngine();m._init(ctx,eng.musicBus,{offline:true});m.play(id,{fade:0,seed:7});for(let t=0;t<seconds+2;t+=.05)m.advance(t);const w=wav(await ctx.startRendering(),false);await save('music_'+id+'.wav',w.bytes);manifest.music[id]={seconds:w.seconds,peak:w.peak,name:song.name,bpm:s.bpm,loopFrom:s.loopFrom*bar,loopEnd:seconds};log('MUSIC '+id+' ('+seconds.toFixed(1)+' s)');}
await save('manifest.json',JSON.stringify(manifest,null,2));log('COMPLETE: '+Object.keys(manifest.sfx).length+' effects, '+Object.keys(manifest.music).length+' songs.');}catch(e){log('ERROR '+e.stack);}};
</script>
